# Protocole "hard v4" : questions du tier hard uniquement, générateur 4.0,
# API officielles de chaque vendeur, plafond de sortie PAR QUESTION.
#
# Chaque entrée du leaderboard est une paire modèle + niveau de thinking : les
# niveaux ne sont pas équivalents d'un vendeur à l'autre et ne prétendent pas
# l'être ; ils sont affichés tels quels (`thinking_level`).
#
# Paramètres génériques par entrée :
#   effort:                  libellé passé au paramètre d'effort de l'API
#                            (Anthropic output_config.effort, OpenAI reasoning.effort,
#                             reasoning_effort pour les API OpenAI-compatibles)
#   thinking_level:          libellé affiché dans le leaderboard (défaut = effort)
#   max_tokens_per_question: plafond de sortie (raisonnement + réponse) par question,
#                            multiplié par la taille du batch
#   extra_body:              paramètres propres au vendeur, fusionnés dans la requête
#   stream: true par défaut ; pas de température (défaut du vendeur)
#
# Deux passes prévues : (1) plafond 16k / effort high sur toutes les entrées,
# (2) effort max sans plafond (max_tokens_per_question: 0 => max_tokens) sur une sélection.

models:
  # --- DeepSeek (API officielle) : thinking.type + reasoning_effort low|high|max
  - name: "deepseek-v4-flash@high"
    api_base: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-v4-flash"
    effort: "high"
    max_tokens_per_question: 16000
    extra_body:
      thinking: {type: "enabled"}
    pricing: {input_per_mtok: 0.14, output_per_mtok: 0.28}

  # --- Anthropic : thinking adaptatif + output_config.effort low|medium|high|xhigh|max
  # - name: "claude-opus-5@high"
  #   api_base: "https://api.anthropic.com/v1"
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   model: "claude-opus-5"
  #   effort: "high"
  #   max_tokens_per_question: 16000
  #   pricing: {input_per_mtok: 5, output_per_mtok: 25, cached_input_per_mtok: 0.5}

  # --- OpenAI (API Responses) : reasoning.effort none|minimal|low|medium|high|xhigh|max selon modèle
  # - name: "gpt-5.5@high"
  #   api_base: "https://api.openai.com/v1"
  #   api_key: "${OPENAI_API_KEY}"
  #   model: "gpt-5.5"
  #   api: "openai_responses"
  #   effort: "high"
  #   max_tokens_per_question: 16000

  # --- Gemini (endpoint OpenAI-compatible) : reasoning_effort low|medium|high
  # - name: "gemini-3.1-pro@high"
  #   api_base: "https://generativelanguage.googleapis.com/v1beta/openai"
  #   api_key: "${GEMINI_API_KEY}"
  #   model: "gemini-3.1-pro-preview"
  #   effort: "high"
  #   max_tokens_per_question: 16000

  # --- Qwen (DashScope, mode OpenAI-compatible ; l'URL dépend de la région/workspace)
  # - name: "qwen3.8-max@xhigh"
  #   api_base: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
  #   api_key: "${DASHSCOPE_API_KEY}"
  #   model: "qwen3.8-max"
  #   effort: "xhigh"
  #   max_tokens_per_question: 16000   # attention : chez Qwen, max_tokens ne couvre pas la chaîne de pensée

  # --- Moonshot / Kimi : K3 = reasoning_effort low|high|max ; K2.6 = extra_body thinking.type
  # - name: "kimi-k3@high"
  #   api_base: "https://api.moonshot.ai/v1"
  #   api_key: "${MOONSHOT_API_KEY}"
  #   model: "kimi-k3"
  #   effort: "high"
  #   max_tokens_per_question: 16000

  # --- Z.ai / GLM : thinking.type + reasoning_effort (GLM-5.3 : low|high|max)
  # - name: "glm-5.3@high"
  #   api_base: "https://api.z.ai/api/paas/v4"
  #   api_key: "${ZAI_API_KEY}"
  #   model: "glm-5.3"
  #   effort: "high"
  #   max_tokens_per_question: 16000
  #   extra_body:
  #     thinking: {type: "enabled"}

benchmarks:
  - name: "hard_v4_en"
    people: 400
    depth: 8
    questions: 60
    root_couples: 4
    seed: 4040
    language: "en"
    difficulty: hard            # tier hard uniquement, tirage équilibré entre types
    # leviers 4.0 par défaut : max_children 2, second_union 20 %, relations mixed,
    # derived_links 30 %, shuffle, max_answer_names 10, drop 40, anonymize 50

evaluation:
  runs_per_benchmark: 1
  max_concurrent_requests: 4
  timeout: 3600
  batch_size: 5               # plafond de requête = 5 x max_tokens_per_question
  output_dir: "evaluation_results/hard_v4"
  output_formats: [csv, json]
